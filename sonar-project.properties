sonar.projectKey=turbopanel_website
sonar.projectName=website
sonar.organization=turbopanel

# CI-based analysis via .github/workflows/verify.yml (SONAR_TOKEN). Automatic
# Analysis must stay off for this project (SonarCloud → Administration →
# Analysis Method); otherwise the CI scanner fails.

# Match the TurboPanel vendored Python pin (daemon PYTHON_VERSION).
sonar.python.version=3.14

# Vitest LCOV from `pnpm test:coverage` (coverage/lcov.info). The TypeScript-
# specific key is deprecated; javascript.lcov covers both JS and TS.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Co-located tests (*.test.ts next to sources). Same roots for sources and
# tests + test.inclusions — do not leave sonar.tests unset (scanner then
# falls back to filename/directory heuristics).
sonar.sources=src,scripts
sonar.tests=src
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx

sonar.exclusions=\
  node_modules/**,\
  .next/**,\
  .open-next/**,\
  .wrangler/**,\
  coverage/**,\
  THIRD_PARTY_NOTICES.md

# Vitest coverage include is src/lib/**/*.ts (see vitest.config.ts). Keep Next
# routes, marketing/docs chrome, and TSX out of the coverage denominator so
# untested pages do not fail Sonar-way Coverage on New Code ≥ 80%.
sonar.coverage.exclusions=\
  node_modules/**,\
  .next/**,\
  .open-next/**,\
  .wrangler/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.tsx,\
  **/*.d.ts,\
  src/app/**,\
  src/components/**,\
  src/lib/source.ts,\
  THIRD_PARTY_NOTICES.md

# Vitest imports are not always recognized by Sonar analysis; S2187 ("Add some
# tests to this file") is a false positive on *.test.ts.
sonar.issue.ignore.multicriteria=denoS2187
sonar.issue.ignore.multicriteria.denoS2187.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.denoS2187.resourceKey=**/*.test.ts
