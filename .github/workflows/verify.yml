name: Verify

on:
  push:
    branches:
      - trunk
      - staging
      - live
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# One run per event and ref at a time. A PR keeps only its newest commit (the
# older run is cancelled). A push never cancels and never drops a run: `queue:
# max` keeps up to 100 pending, so quick merges each get their own Verify. With
# the default single-pending queue the middle run is replaced and concludes
# cancelled, which paints a red mark on a commit that was never broken.
# The trunk -> staging and staging -> live promotion PRs are the exception: a
# merge moves their head every few minutes, and cancelling the run on the old
# head left a cancelled (red) mark on that trunk commit. Their groups end in the
# run id, so every head gets its own run and nothing is cancelled.
concurrency:
  group: website-verify-${{ github.event_name }}-${{ (github.head_ref == 'trunk' || github.head_ref == 'staging') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'trunk' && github.head_ref != 'staging' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

jobs:
  # Lint + typecheck + Vitest LCOV, then Sonar quality gate. If Sonar fails,
  # the workflow stops. Automatic Analysis must stay off
  # (Administration → Analysis Method).
  verify:
    runs-on: ubuntu-latest
    concurrency:
      group: website-sonar-${{ github.event_name }}-${{ (github.head_ref == 'trunk' || github.head_ref == 'staging') && github.run_id || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'trunk' && github.head_ref != 'staging' }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for SonarCloud new-code / blame (shallow clones skew the gate).
          fetch-depth: 0

      - name: Require SONAR_TOKEN
        # Fork PRs and Dependabot PRs cannot receive repository secrets — GitHub
        # withholds them from the dependabot[bot] actor even on same-repo
        # branches — so the require is skipped there and the rest of the chain
        # still gates; the scan below then skips on the empty token. Every other
        # trigger (trunk pushes, same-repo PRs, workflow_call) must have it.
        if: >-
          github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is missing — add the secret on TurboPanel/website (or org)."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.7.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Secret scan (every tracked file)
        # The pre-commit hook scans staged files only; CI scans the whole tree.
        run: sh scripts/scan-secrets.sh --all

      # The commits a PR adds, not just its final tree: a secret committed and
      # removed again inside the PR still sits in the history that gets merged.
      # PRs into staging/live carry trunk commits that were already scanned on
      # their own PRs, so only PRs into trunk are scanned by range.
      - name: Scan pull request commits for secrets
        if: github.event_name == 'pull_request' && github.base_ref == 'trunk'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: sh scripts/scan-secrets.sh --range "$BASE_SHA..$HEAD_SHA"

      - name: Secret scanner self-test
        run: sh scripts/scan-secrets.selftest.sh

      - name: Check vocabulary
        run: pnpm check:vocabulary

      - name: Check third-party notices
        run: pnpm notices:check

      # Dependency Advisory Gate (TurboPanel/dev): fails only on a HIGH or
      # CRITICAL advisory that already has a fixed version; everything else is
      # a warning annotation. Override for one verified not exploitable here:
      # an [[IgnoredVulns]] entry with a reason in osv-scanner.toml.
      - name: Dependency advisory gate (osv-scanner)
        uses: TurboPanel/dev/.github/actions/osv-scan@8512d65091c662383a4aa6ff2848e16230ccc5e1 # dev#55

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

      - name: Check docs SSR
        run: pnpm check:docs-ssr

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage LCOV
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: SonarQube Scan
        id: sonar
        # Skipped when SONAR_TOKEN is empty (fork or Dependabot PR) and on the
        # automatic promotion PRs into staging/live, which carry only commits
        # already analysed on trunk (no new code to gate).
        if: >-
          env.SONAR_TOKEN != ''
          && !(github.event_name == 'pull_request'
               && (github.base_ref == 'staging' || github.base_ref == 'live'))
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

      # The Sonar way gate fails only on ratings, so one new code smell passes
      # it; this fails the PR on any new issue (owner rule, 2026-09-30). Runs
      # only where the PR scan above ran, so it skips the promotion PRs too.
      - name: No new Sonar issues
        if: github.event_name == 'pull_request' && steps.sonar.outcome == 'success'
        uses: TurboPanel/dev/.github/actions/sonar-new-issues@2db1bbfa3cff89a52fac3ee4a53bd495dc1c79b1 # dev#47

  # Single aggregate check for the branch rulesets. It needs every job that
  # runs on pull_request and fails unless all of them succeeded. Required-check
  # contexts move from the individual job names to this one context so a job
  # rename or a new job never blocks merges on a name the ruleset still waits
  # for.
  #
  # When it runs: on a pull request, always — a cancelled or skipped need is a
  # failure there (no job above is conditional on PR events, so "skipped" can
  # only mean a dependency failed), and the required check must never be left
  # pending. On a push (trunk / staging / live) it is skipped when the run was cancelled or
  # when any need was cancelled: the jobs above sit in job-level concurrency
  # groups, so a newer push cancels this run's still-pending job without
  # cancelling the run itself. A superseded push is not a broken change, so it
  # must not paint the commit red.
  ci-ok:
    name: ci-ok
    needs: [verify]
    if: ${{ (github.event_name == 'pull_request' && always()) || (!cancelled() && !contains(needs.*.result, 'cancelled')) }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: website-ci-ok-${{ github.event_name }}-${{ (github.head_ref == 'trunk' || github.head_ref == 'staging') && github.run_id || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'trunk' && github.head_ref != 'staging' }}
    steps:
      - name: Fail unless every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' >/dev/null
