# Cuts a GitHub Release on a v* tag. website has no build/package step to
# release — production is a VPS `node server.js` deploy driven by GitHub
# webhooks, unrelated to this — so this is a notes-only release, purely for
# version tracking and to give the compatibility matrix / release notes a
# place to link to. See the Road to 0.1.x page's `other-repos` item.

name: Release

on:
  push:
    # v[0-9]* (not v*) so a dry-run dispatch's own tag (e.g. vtest-workflow-0,
    # created by gh release create with no matching pre-existing tag) can't
    # re-trigger this same workflow via the tag-push path -- that would race
    # a second `gh release create` against a tag that already has a release.
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to release without a leading v (e.g. test-workflow-0 for a dry run -- avoid a leading digit so the tag doesn't match v[0-9]* and re-trigger this workflow)
        required: true
        type: string
      channel:
        description: Channel label for this release
        required: true
        type: string
        default: rc

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      channel: ${{ steps.resolve.outputs.channel }}
    steps:
      - name: Resolve version and channel
        id: resolve
        run: |
          set -eu
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "channel=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
          else
            _ref="${{ github.ref_name }}"
            echo "version=${_ref#v}" >> "$GITHUB_OUTPUT"
            echo "channel=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: inputs.version == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the tag to match package.json's version
        # A tag cut before the bump is a release that lies about itself
        # (sonar.projectVersion is pinned to package.json by the repo's own
        # checks). Dry runs (workflow_dispatch) use throwaway versions and
        # skip this.
        if: inputs.version == ''
        run: |
          set -eu
          _tag_version="${{ steps.resolve.outputs.version }}"
          _pkg_version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          if [ "$_tag_version" != "$_pkg_version" ]; then
            echo "::error::tag v${_tag_version} does not match package.json version ${_pkg_version} — bump package.json (and sonar.projectVersion) first"
            exit 1
          fi

  release:
    needs: prepare
    uses: TurboPanel/dev/.github/workflows/gh-release.yml@177d481666cce2e1dcfa76290b141b0149a6a0a9 # dev trunk 2026-09-25
    with:
      version: ${{ needs.prepare.outputs.version }}
      channel: ${{ needs.prepare.outputs.channel }}
      release-notes: "See https://github.com/${{ github.repository }}/commits/v${{ needs.prepare.outputs.version }} for changes."
