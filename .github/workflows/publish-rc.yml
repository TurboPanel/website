# Publishes the next x.y.z-rc.N when the trunk → staging PR is merged (Road to
# 0.2.x, versioning flow). Runs on the push the merge makes to staging — a push
# runs the workflow file from the pushed commit, so the very first merge (which
# brings this file into staging) already works.
#
# website ships no binary, so an rc is a notes-only release: the merged trunk
# commit is tagged v<version>-rc.N and a GitHub Release is created. The version
# comes from git tags (the newest release's next patch, or a version started
# with turbopaneld's Start Next Version), never from package.json.
#
#   1. resolve  the merged PR's head commit and the version from the tags
#   2. prepare / publish / finalize   the shared promote workflows
#               (TurboPanel/dev), notes-only, with NO approval gate — the merge
#               was the deliberate act
#   3. release-pr  opens (or refreshes) the staging → live PR "Release <version>"
#
# A push to staging that is not a merged trunk PR does nothing.
# workflow_dispatch re-runs it for a given trunk commit.

name: Publish Release Candidate

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      commit:
        description: Trunk commit to tag as the next rc
        required: true
        type: string

# Least privilege: read-only by default, each job asks for what it uses. The
# GITHUB_TOKEN never writes a pull request here (the Release App token does),
# and the TurboPanel/dev reusable jobs need `contents: write` (tags, releases).
permissions:
  contents: read

concurrency:
  group: publish-rc
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read # tags
      pull-requests: read # the PR a pushed commit came from
    outputs:
      proceed: ${{ steps.r.outputs.proceed }}
      commit: ${{ steps.r.outputs.commit }}
      version: ${{ steps.r.outputs.version }}
    steps:
      # The version from the tags (the newest release's next patch, or a
      # started version), never package.json.
      - name: Work out the version from the tags
        id: base
        uses: TurboPanel/dev/.github/actions/version@dadee433d35a73c7a9946268c30a96e466371140 # dev#44
        with:
          mode: base

      - name: Find the merged PR
        id: r
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PUSHED: ${{ github.sha }}
          INPUT_COMMIT: ${{ inputs.commit }}
          BASE_VERSION: ${{ steps.base.outputs.base }}
        run: |
          set -eu
          if [ "$EVENT" = "workflow_dispatch" ]; then
            commit="$INPUT_COMMIT"
          else
            # Only a merged trunk → staging PR publishes an rc. The API can take a
            # moment to associate the merge commit with its PR.
            pr=""
            for _ in 1 2 3 4 5 6; do
              pr="$(gh api "repos/$REPO/commits/$PUSHED/pulls" --jq '[.[] | select(.base.ref == "staging" and .head.ref == "trunk" and .merged_at != null)][0].number // empty')"
              [ -n "$pr" ] && break
              sleep 10
            done
            if [ -z "$pr" ]; then
              echo "push to staging is not a merged trunk PR — nothing to publish"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            commit="$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)"
            echo "PR #$pr merged trunk commit $commit"
          fi

          version="$BASE_VERSION"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::could not work out a version from the tags (got '$version')"; exit 1 ;;
          esac

          # Idempotence: this commit already has an rc (a re-run) — do not publish rc.N+1 of the same bytes.
          for ref in $(gh api --paginate "repos/$REPO/git/matching-refs/tags/v$version-rc." --jq '.[].ref' | sed 's#^refs/tags/##'); do
            if [ "$(gh api "repos/$REPO/commits/$ref" --jq .sha)" = "$commit" ]; then
              echo "$ref already carries $commit — nothing to publish"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          {
            echo "proceed=true"
            echo "commit=$commit"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "publishing an rc of $version from $commit"

  prepare:
    needs: resolve
    permissions:
      contents: write
    if: needs.resolve.outputs.proceed == 'true'
    uses: TurboPanel/dev/.github/workflows/gh-promote.yml@d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
    with:
      repo-kind: notes-only
      to: rc
      source: ${{ needs.resolve.outputs.commit }}
      dev-ref: d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
      # The merge of the promotion PR is the approval.
      approval-environment: ""
    secrets: inherit

  publish:
    needs: prepare
    permissions:
      contents: write
    uses: TurboPanel/dev/.github/workflows/gh-release.yml@dadee433d35a73c7a9946268c30a96e466371140 # dev#44
    with:
      version: ${{ needs.prepare.outputs.version }}
      channel: rc
      release-notes: ${{ needs.prepare.outputs.release-notes }}
      assets-artifact-name: ${{ needs.prepare.outputs.assets-artifact-name }}
      manifest-filename: ${{ needs.prepare.outputs.manifest-filename }}
      target-commit: ${{ needs.prepare.outputs.commit }}
    secrets: inherit

  finalize:
    needs: [prepare, publish]
    permissions:
      contents: write
    uses: TurboPanel/dev/.github/workflows/gh-promote-finalize.yml@dadee433d35a73c7a9946268c30a96e466371140 # dev#44
    with:
      to: rc
      version: ${{ needs.prepare.outputs.version }}
      commit: ${{ needs.prepare.outputs.commit }}
      branch: ${{ needs.prepare.outputs.branch }}
      manifest-filename: ${{ needs.prepare.outputs.manifest-filename }}
    secrets: inherit

  release-pr:
    needs: [resolve, prepare, finalize]
    runs-on: ubuntu-latest
    permissions:
      contents: read # the dev checkout; the PR is written with the App token
    steps:
      - name: Mint a Release App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Check out the changelog script (TurboPanel/dev)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TurboPanel/dev
          ref: dadee433d35a73c7a9946268c30a96e466371140 # dev#44
          path: .promote
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/promote
          sparse-checkout-cone-mode: false

      - name: Open or refresh the staging → live PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.resolve.outputs.version }}
          RC: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          existing="$(gh pr list --repo "$REPO" --base live --head staging --state open --json number --jq '.[0].number // empty')"
          {
            echo "Merging this publishes the release \`v$VERSION\` from \`v$RC\` (same bytes, re-signed) and moves \`live\`. It runs automatically after the merge (\`publish-release.yml\`)."
            echo
            echo "**Since the last release:**"
            echo
            sh .promote/scripts/promote/changelog.sh "$REPO" live staging 80
            echo
            echo "Merge with a merge commit (live takes merge commits only). Wait for \`ci-ok\` first."
          } > body.md
          title="Release $VERSION"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$REPO" --title "$title" --body-file body.md
          else
            gh pr create --repo "$REPO" --base live --head staging --title "$title" --body-file body.md
          fi
